<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Profile photo placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="45%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="fig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#c7d2fe" stop-opacity="0.72" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1" />
    </pattern>
    <clipPath id="round">
      <rect width="512" height="512" rx="64" />
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#bg)" />
    <rect width="512" height="512" fill="url(#grid)" />
    <rect width="512" height="512" fill="url(#glow)" />

    <!-- shoulders -->
    <path d="M92 512c0-96 74-158 164-158s164 62 164 158z" fill="url(#fig)" opacity="0.92" />
    <!-- head -->
    <circle cx="256" cy="208" r="94" fill="url(#fig)" />
    <!-- collar cut-out -->
    <path d="M212 372h88l-44 62z" fill="#4f46e5" opacity="0.55" />

    <!-- decorative code glyphs -->
    <g fill="#ffffff" opacity="0.55" font-family="monospace" font-size="30" font-weight="700">
      <text x="52" y="96">&lt;/&gt;</text>
      <text x="368" y="452">{ }</text>
    </g>
  </g>
</svg>
